name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: Typecheck + tests + build + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npx vitest run --coverage

      - name: Build
        run: npm run build

      - name: Verify package (publint + are-the-types-wrong)
        run: |
          npx publint
          npx @arethetypeswrong/cli --pack . --profile node16

      - name: npm audit (moderate+)
        run: npm audit --omit=dev --audit-level=moderate

      - name: Pack tarball
        run: npm pack

      - name: Upload tarball (consumed by e2e/sdk-testapp)
        uses: actions/upload-artifact@v5
        with:
          name: atol-sdk-react-tgz
          path: atol-sh-react-*.tgz
          retention-days: 14
